[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "codex-tier-widget"
version     = "0.3.0"
description = "紧凑桌面悬浮窗：展示三档模型的 IQ、费用与性价比排序"
readme      = "README.md"
license     = { text = "MIT" }
authors     = [
    { name = "codering_widget contributors" }
]
keywords    = ["codex", "openai", "desktop-widget", "tkinter", "floating-window", "iotest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.11"

dependencies = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pyflakes>=3.2",
]

[project.urls]
Homepage      = "https://github.com/lztpho/codex-tier-widget"
Repository    = "https://github.com/lztpho/codex-tier-widget"
Issues        = "https://github.com/lztpho/codex-tier-widget/issues"
Changelog     = "https://github.com/lztpho/codex-tier-widget/blob/main/CHANGELOG.md"

[project.scripts]
# 安装后可直接 `codex-widget` 启动（可选用）
# 当前更推荐 `python -m codex_tier_widget`

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 资源（暂无）
"codex_tier_widget" = []

# ────────────────────────────────────────────────────────────────────────────
# Ruff / pyflakes 配置
# ────────────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # bugbear
    "I",    # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (we use lambda trick on purpose)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports (re-exports)
"__main__.py" = ["B008"]
"widget.py"  = ["B008"]  # on_use=lambda closures

[tool.ruff.format]
quote-style = "preserve"

# ────────────────────────────────────────────────────────────────────────────
# pyflakes 配置
# ────────────────────────────────────────────────────────────────────────────

[tool.pyflakes]
exclude = [".venv", "build", "dist"]

# ────────────────────────────────────────────────────────────────────────────
# coverage
# ────────────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["src/codex_tier_widget"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
