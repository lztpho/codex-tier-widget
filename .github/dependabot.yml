version: 2

# Dependabot 自动更新 GitHub Actions 和 Python 依赖的版本。
# 跟踪 GitHub Actions 与运行时 Python 依赖。

updates:
  # GitHub Actions 自身版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Python 依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

# 忽略某些更新策略
ignore:
  # 周末不打扰
  - days-before-response: 7
    update-types: ["version-update:semver-major"]
