name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build single-file Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean CodexTierWidget.spec

      - name: Create checksum
        shell: pwsh
        run: |
          $Hash = (Get-FileHash 'dist\CodexTierWidget.exe' -Algorithm SHA256).Hash.ToLower()
          "$Hash  CodexTierWidget.exe" | Set-Content 'dist\CodexTierWidget.sha256' -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexTierWidget-Windows
          path: |
            dist/CodexTierWidget.exe
            dist/CodexTierWidget.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = '${{ github.ref_name }}'
          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $Tag 'dist\CodexTierWidget.exe' 'dist\CodexTierWidget.sha256' --clobber
          }
          else {
            gh release create $Tag 'dist\CodexTierWidget.exe' 'dist\CodexTierWidget.sha256' --title "Codex Tier Widget $Tag" --generate-notes
          }
