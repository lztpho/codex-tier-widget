name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build single-file Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean CodexTierWidget.spec

      - name: Create checksum
        shell: pwsh
        run: |
          $Hash = (Get-FileHash 'dist\CodexTierWidget.exe' -Algorithm SHA256).Hash.ToLower()
          "$Hash  CodexTierWidget.exe" | Set-Content 'dist\CodexTierWidget.sha256' -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexTierWidget-Windows
          path: |
            dist/CodexTierWidget.exe
            dist/CodexTierWidget.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = '${{ github.ref_name }}'
          $Version = $Tag -replace '^v', ''
          $Changelog = Get-Content 'CHANGELOG.md' -Raw -Encoding utf8
          $EscapedVersion = [regex]::Escape($Version)
          $Pattern = "(?ms)^## \[$EscapedVersion\][^\r\n]*\r?\n(?<notes>.*?)(?=^## \[|\z)"
          $Section = [regex]::Match($Changelog, $Pattern)
          if (-not $Section.Success) {
            throw "CHANGELOG.md 中缺少 $Tag 对应的版本章节"
          }

          $Notes = "## $Tag`r`n`r`n" + $Section.Groups['notes'].Value.Trim()
          $NotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText(
            $NotesPath,
            $Notes,
            [Text.UTF8Encoding]::new($false)
          )

          gh release view $Tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $Tag --title "Codex Tier Widget $Tag" --notes-file $NotesPath
            gh release upload $Tag 'dist\CodexTierWidget.exe' 'dist\CodexTierWidget.sha256' --clobber
          }
          else {
            gh release create $Tag 'dist\CodexTierWidget.exe' 'dist\CodexTierWidget.sha256' --title "Codex Tier Widget $Tag" --notes-file $NotesPath
          }
