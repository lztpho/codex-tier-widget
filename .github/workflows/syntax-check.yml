name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax + import smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile syntax check
        run: |
          python -m compileall -q src/
          echo "✓ syntax OK"

      - name: Import smoke test
        run: |
          # Test that all modules import without errors.
          # Mock tkinter if unavailable (e.g. on headless CI).
          python -c "
          import sys
          # Don't actually open the UI in CI.
          # Just import modules to catch import-time errors.
          sys.path.insert(0, 'src')
          import codex_tier_widget
          import codex_tier_widget.autostart
          import codex_tier_widget.config
          import codex_tier_widget.color
          import codex_tier_widget.data
          import codex_tier_widget.tray
          print('✓ all modules import OK')
          "

      - name: Color module unit smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from codex_tier_widget.color import price_color_for, score_for
          color = price_color_for(40)
          assert color.startswith('#'), f'color should be hex: {color}'
          # score_for accepts None / 0 IQ gracefully
          assert score_for({'iq': 0, 'average_price_usd': 1.0}) is None
          assert score_for({'iq': 90, 'average_price_usd': 0}) is None
          s = score_for({'iq': 90, 'average_price_usd': 3.0})
          assert abs(s - 30) < 1e-6
          print('✓ color.py smoke OK')
          "
